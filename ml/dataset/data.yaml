# ============================================================
# YOLO dataset contract — Onion Quality AI
# 8-class system aligned with NCCF 2026 procurement specifications.
# Classes (STABLE contract, never renumber):
#   0 = onion        (healthy bulb)
#   1 = damaged      (generic physical damage)
#   2 = rotten       (decay / soft rot / fungal rot)
#   3 = sprouted     (green sprout emerging)
#   4 = cut_crack    (cuts, cracks)
#   5 = smut         (black smut / mut infection)
#   6 = discoloured  (staining / discoloration)
#   7 = fresh_roots  (rooting / rooted)
# Layout guide: docs/dataset/DATASET_GUIDE.md
# ============================================================

# Dataset root — resolved relative to this file. Point `path` at an absolute
# location if your data lives outside the repo (e.g. an external drive).
path: ml/dataset
train: images/train
val: images/val

nc: 8
names: [onion, damaged, rotten, sprouted, cut_crack, smut, discoloured, fresh_roots]
